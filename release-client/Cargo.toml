[package]
name = "fvca-release-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[features]
appliance = ["dep:fvca-allocator-binding"]
swtpm-test = []

[dependencies]
async-trait = "0.1"
aws-lc-rs = { version = "1", default-features = false }
futures-util = "0.3"
fvca-allocator-binding = { path = "../bootstrap/allocator-binding", optional = true }
fvca-btrfs-boundary = { path = "../bootstrap/btrfs-boundary" }
fvca-trial-authorization = { path = "../bootstrap/trial-authorization" }
hex = "0.4"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
object = { version = "=0.41.0", default-features = false, features = ["pe", "read_core", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustix = { version = "1", features = ["event", "fs", "mount", "net", "process", "thread"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-util = { version = "0.7", features = ["io"] }
tough = { version = "=0.24.0", default-features = false }
url = { version = "2", features = ["serde"] }
zeroize = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
panic = "abort"
strip = "symbols"
