[Include]
Include=../../mkosi.os-policy.conf

[Output]
Format=cpio
Output=initrd
ManifestFormat=json
SplitArtifacts=
CompressOutput=zstd

[Content]
Bootable=no
MakeInitrd=yes
WithRecommends=no
Ssh=never
Packages=
    systemd
    systemd-udev
    kmod
    libbpf
    util-linux-core
    kernel-core
    kernel-modules-core
BuildPackages=
    rust-1.100.0-1.fc45
    cargo-1.100.0-1.fc45
    gcc-16.2.1-3.fc45
BuildScripts=%D/tools/build-bootstrap.sh.chroot
KernelModules=
    dm-mod
    dm-verity
    erofs
    virtio_blk
    virtio_pci
    efivarfs
RemoveFiles=
    /boot/*
    /usr/lib/modules/*/vmlinuz*
    /usr/lib/modules/*/System.map
