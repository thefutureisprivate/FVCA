[Include]
Include=../../mkosi.os-policy.conf

[Output]
Format=cpio
Output=initrd
ManifestFormat=json
SplitArtifacts=
CompressOutput=zstd

[Content]
Bootable=no
MakeInitrd=yes
WithRecommends=no
Ssh=never
Packages=
    systemd
    systemd-udev
    kmod
    util-linux-core
    kernel-core
    kernel-modules-core
KernelModules=
    dm-mod
    dm-verity
    erofs
    virtio_blk
    virtio_pci
    efivarfs
RemoveFiles=
    /boot/*
    /usr/lib/modules/*/vmlinuz*
    /usr/lib/modules/*/System.map
