[Include]
Include=mkosi.profiles/service-guest-storage.conf
        mkosi.network.conf

[Content]
Packages=keyutils-1.6.3-8.fc45
         veritysetup-2.8.8-1.fc45
ExtraTrees=%D/mkosi.guest-runtime-initrd
KernelModules=
    overlay
    loop
    nft_limit
    virtio_console
    virtio_net
RemoveFiles=
    /etc/keyutils
    /etc/request-key.conf
    /etc/request-key.d
    /usr/bin/key.dns_resolver
    /usr/bin/request-key
    /usr/share/keyutils

[Build]
Environment=FVCA_GUEST_OCI=yes
