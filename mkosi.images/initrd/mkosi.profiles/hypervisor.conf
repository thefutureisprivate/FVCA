[Content]
Packages=
    cryptsetup-2.8.8-1.fc45
    device-mapper-1.02.217-2.fc45
    iproute-7.0.0-2.fc45
    nftables-1.1.6-4.fc45
    veritysetup-2.8.8-1.fc45
BuildPackages=
    openssl-devel-4.0.3-1.fc45
BuildScripts=%D/tools/build-runtime-activation.sh.chroot
ExtraTrees=%D/mkosi.hypervisor-initrd
KernelModules=
    overlay
    kvm-intel
    i6300esb
    loop
    dm-crypt
    dm-integrity
    authenc
    hmac
    xts
    nvme
    btrfs
    vfat
    nls_cp437
    nls_iso8859-1
    tpm-crb
    tpm-tis
    bridge
    nf_tables
    nft_ct
    igb
    igc
RemoveFiles=
    /usr/bin/bridge
    /usr/bin/ctstat
    /usr/bin/dcb
    /usr/bin/devlink
    /usr/bin/dpll
    /usr/bin/genl
    /usr/bin/ifstat
    /usr/bin/lnstat
    /usr/bin/netshaper
    /usr/bin/nstat
    /usr/bin/rdma
    /usr/bin/rtacct
    /usr/bin/rtmon
    /usr/bin/rtstat
    /usr/bin/ss
    /usr/bin/tipc
    /usr/bin/vdpa
    /usr/lib/udev/rules.d/64-btrfs.rules
    /usr/lib64/cryptsetup/libcryptsetup-token-systemd-fido2.so
    /usr/lib64/cryptsetup/libcryptsetup-token-systemd-pkcs11.so
    /usr/lib/nvpcr

[Build]
Environment=FVCA_HYPERVISOR_STORAGE=yes
            FVCA_HOST_FIRMWARE=yes
