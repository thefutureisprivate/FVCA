[Content]
Packages=mdadm-4.6-2.fc45
BuildScripts=%D/tools/build-runtime-activation.sh.chroot
ExtraTrees=%D/mkosi.hypervisor-initrd
KernelModules=
    overlay
    kvm-intel
    raid1
    dm-crypt
    btrfs
RemoveFiles=
    /etc/libreport/events.d/mdadm_event.conf
    /etc/sysconfig/raid-check
    /etc/systemd/system/multi-user.target.wants/mdmonitor.service
    /etc/systemd/system/timers.target.wants/raid-check.timer
    /usr/bin/mdmon
    /usr/bin/raid-check
    /usr/bin/raid6check
    /usr/lib/systemd/system-shutdown/mdadm.shutdown
    /usr/lib/systemd/system/mdadm-*
    /usr/lib/systemd/system/mdcheck*
    /usr/lib/systemd/system/mdmon*
    /usr/lib/systemd/system/raid-check*
    /usr/lib/udev/rules.d/64-md-raid-assembly.rules
    /usr/lib/udev/rules.d/64-btrfs.rules
    /usr/lib/udev/rules.d/69-md-clustered-confirm-device.rules
    /usr/share/mdadm

[Build]
Environment=FVCA_HYPERVISOR_STORAGE=yes
