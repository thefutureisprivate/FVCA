[package]
name = "fvca-initrd-bootstrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
fvca-allocator-binding = { path = "allocator-binding" }
fvca-btrfs-boundary = { path = "btrfs-boundary", optional = true }
fvca-libvirt-boundary = { path = "libvirt-boundary", optional = true }
fvca-signature-boundary = { path = "signature-boundary", optional = true }
fvca-trial-authorization = { path = "trial-authorization" }

[features]
libvirt = ["dep:fvca-btrfs-boundary", "dep:fvca-libvirt-boundary"]
backup = []
promotion = ["dep:fvca-signature-boundary"]

[[bin]]
name = "fvca-backup-worker"
required-features = ["backup"]

[[bin]]
name = "fvca-qualify-libvirt"
required-features = ["libvirt"]

[[bin]]
name = "fvca-launch-guest"
required-features = ["libvirt"]

[[bin]]
name = "fvca-trial-health"
required-features = ["libvirt"]

[[bin]]
name = "fvca-verify-boot-approval"
required-features = ["promotion"]

[profile.release]
panic = "abort"
strip = "symbols"
