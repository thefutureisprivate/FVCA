[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64
RepositoryKeyCheck=yes

[Output]
Format=sysext
ImageId=oci-runtime
OutputDirectory=../build/oci-runtime
Overlay=yes
ManifestFormat=json
SplitArtifacts=roothash
CompressOutput=no

[Content]
BaseTrees=../build/service-guest-runtime-base/root
Bootable=no
SELinuxRelabel=no
WithDocs=no
WithRecommends=no
Ssh=never
Packages=
    aardvark-dns-2.1.0-1.fc45
    catatonit-0.2.1-6.fc45
    conmon-2.2.1-2.fc45
    containers-common-extra-0.70.0-1.fc45
    crun-1.31-1.fc45
    netavark-2.1.0-1.fc45
    podman-6.2.0-1.fc45
    podman-sequoia-0.3.2-4.fc45
    restic-0.19.1-1.fc45
FinalizeScripts=../tools/pack-runtime.py
PostOutputScripts=../tools/check-runtime-packages.py

[Validation]
Verity=signed
VerityKey=../build/oci-runtime-signing.key
VerityCertificate=../build/oci-runtime-signing.crt
Checksum=yes

[Build]
WithNetwork=no
BuildSources=..
Environment=FVCA_RUNTIME=oci-runtime
            SYSEXT_SCOPE=initrd
            SYSTEMD_REPART_MKFS_OPTIONS_EROFS=--file-contexts=/buildroot/etc/selinux/targeted/contexts/files/file_contexts
