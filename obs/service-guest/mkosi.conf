# needssslcertforbuild
#
# Offline RPM mirror inputs for the Service Guest core and its initramfs.
[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64

[Content]
Packages=systemd systemd-udev systemd-boot-unsigned libbpf kernel-core kernel-modules-core util-linux-core kmod libstdc++ policycoreutils selinux-policy-targeted
    container-selinux containers-common openssl-libs qemu-guest-agent iproute nftables keyutils
BuildPackages=gcc gcc-c++ make patch patchelf python3 rpm tar rust cargo openssl-devel pkgconf-pkg-config zstd
