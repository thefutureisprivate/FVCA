# needssslcertforbuild
#
# Offline RPM mirror inputs for the Hypervisor core and its initramfs.
[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64

[Content]
Packages=systemd systemd-udev systemd-boot-unsigned libbpf kernel-core kernel-modules-core util-linux-core kmod libstdc++ policycoreutils selinux-policy-targeted
    audit-libs dbus-libs expat glib2 gnutls hwdata libblkid libcap-ng libcurl libusb1 libxmlb openssl-libs sqlite-libs xz-libs zlib-ng-compat
    cryptsetup device-mapper veritysetup iproute nftables
BuildPackages=gcc gcc-c++ make patch patchelf python3 rpm tar rust cargo
    dbus-daemon diffutils gettext glib2-devel gnutls-devel libblkid-devel libcurl-devel libusb1-devel libxmlb-devel meson ninja-build openssl-devel
    pkgconf python3-jinja2 sqlite-devel systemd-devel xz-devel zlib-ng-compat-devel
