[Match]
Image=main

[Include]
Include=mkosi.service-guest.conf

[Output]
ImageId=fvca-dev-service-guest

[Content]
ExtraTrees=%D/mkosi.service-guest-core
Packages=
    containers-common-0.70.0-1.fc45
    openssl-libs-4.0.3-1.fc45
    qemu-guest-agent-11.1.3-1.fc45
BuildPackages=
    openssl-devel-4.0.3-1.fc45
    pkgconf-pkg-config-2.5.1-2.fc45
BuildScripts=%D/tools/build-workload-activation.sh.chroot
RemoveFiles=
    # The core's /etc/containers/storage.conf selects the driver.
    /usr/share/containers/storage.conf.d
    /usr/share/containers/storage.rootful.conf.d
    /usr/share/containers/storage.rootless.conf.d
    # Only the FVCA unit, device rule and verified RPC allowlist are used.
    /etc/qemu-ga
    /etc/sysconfig/qemu-ga
    /etc/systemd/system/*.wants/qemu-guest-agent.service
    /usr/lib/systemd/system/qemu-guest-agent.service
    /usr/lib/systemd/system/*.wants/qemu-guest-agent.service
    /usr/lib/udev/rules.d/99-qemu-guest-agent.rules
    /usr/share/qemu/qemu-ga
    /var/log/qemu-ga
