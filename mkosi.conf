[Config]
MinimumVersion=26
Dependencies=initrd

[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64
RepositoryKeyCheck=yes

[Output]
Format=disk
ImageId=fvca-dev-base
OutputDirectory=build
ManifestFormat=json
SplitArtifacts=uki,roothash
CompressOutput=no

[Content]
Bootable=yes
Bootloader=uki
Initrds=%O/initrd
KernelModulesInitrd=no
WithRecommends=no
Ssh=never
RootPassword=hashed:!
Packages=
    systemd
    systemd-udev
    systemd-boot-unsigned
    kernel-core
    kernel-modules-core
    util-linux-core
RemoveFiles=
    /boot/fedora
    /boot/loader
    /boot/symvers-*
KernelCommandLine=
    ro
    console=ttyS0
    systemd.unit=fvca-base.target
    systemd.gpt_auto=no
    systemd.getty_auto=no
    rd.systemd.getty_auto=no
    systemd.volatile=state
    rd.systemd.mask=systemd-sysext-sysroot.service
    rd.systemd.mask=systemd-confext-sysroot.service
    systemd.mask=systemd-sysext.service
    systemd.mask=systemd-confext.service
    systemd.verity_root_options=panic-on-corruption

[Validation]
SecureBoot=yes
SecureBootAutoEnroll=no
SignExpectedPcr=no
Verity=signed
Checksum=yes

[Runtime]
Firmware=uefi-secure-boot
FirmwareVariables=custom
RuntimeNetwork=none
Ephemeral=yes
VSock=no
TPM=no
