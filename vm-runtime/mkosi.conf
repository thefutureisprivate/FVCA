[Config]
MinimumVersion=26

[Include]
Include=../mkosi.rust.conf

[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64
RepositoryKeyCheck=yes

[Output]
Format=sysext
ImageId=vm-runtime
OutputDirectory=../build/vm-runtime
Overlay=yes
ManifestFormat=json
SplitArtifacts=roothash
CompressOutput=no

[Content]
BaseTrees=../build/vm-runtime-base/root
Bootable=no
SELinuxRelabel=no
WithDocs=no
WithRecommends=no
Ssh=never
Packages=
    edk2-ovmf-20260812-10.fc45
    libvirt-daemon-driver-qemu-12.6.0-4.fc45
    libvirt-daemon-lock-12.6.0-4.fc45
    libvirt-daemon-log-12.6.0-4.fc45
    libvirt-daemon-plugin-lockd-12.6.0-4.fc45
    qemu-img-11.1.3-1.fc45
    libslirp-4.9.3-2.fc45
    pixman-0.46.2-4.fc45
    restic-0.19.1-1.fc45
    seavgabios-bin-1.17.0-16.fc45
BuildPackages=
    binutils-2.47-1.fc45
    glib2-devel-2.90.1-1.fc45
    libseccomp-devel-2.6.1-3.fc45
    libslirp-devel-4.9.3-2.fc45
    libvirt-devel-12.6.0-4.fc45
    make-4.4.1-13.fc45
    meson-1.12.1-2.fc45
    ninja-build-1.13.2-6.fc45
    pixman-devel-0.46.2-4.fc45
    pkgconf-2.5.1-2.fc45
    python3-packaging-26.2-4.fc45
    python3-pip-26.1.2-5.fc45
    python3-pycotap-1.3.1-13.fc45
    python3-pyparsing-3.1.2-18.fc45
    python3-qemu-qmp-0.0.5-4.fc45
    python3-setuptools-83.0.0-2.fc45
    python3-wheel-0.48.0-1.fc45
    tar-1.35-10.fc45
    xz-5.8.3-2.fc45
    zlib-ng-compat-devel-2.3.3-6.fc45
BuildScripts=
    ../tools/build-libvirt-probe.sh.chroot
    ../tools/build-qemu-kvm.sh.chroot
FinalizeScripts=../tools/pack-runtime.py
PostOutputScripts=../tools/check-runtime-packages.py

[Validation]
Verity=signed
VerityKey=../build/vm-runtime-signing.key
VerityCertificate=../build/vm-runtime-signing.crt
Checksum=yes

[Build]
WithNetwork=no
BuildSources=..
Environment=FVCA_RUNTIME=vm-runtime
            SYSEXT_SCOPE=initrd
            SYSTEMD_REPART_MKFS_OPTIONS_EROFS=--file-contexts=/buildroot/etc/selinux/targeted/contexts/files/file_contexts
