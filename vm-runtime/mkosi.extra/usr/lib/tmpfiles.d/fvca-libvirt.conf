d /var/log/libvirt/qemu 0750 root root -
d /var/lib/libvirt 0711 root root -
d /var/lib/libvirt/qemu 0711 root root -
d /var/lib/libvirt/qemu/nvram 0711 root root -
d /var/cache/libvirt 0700 root root -
