[Content]
WithDocs=no
CleanPackageMetadata=yes
RootPassword=hashed:!
RootShell=/usr/bin/nologin
ExtraTrees=%D/mkosi.os-policy
BuildPackages=zstd-1.5.7-6.fc45
BuildScripts=%D/tools/build-uutils.sh.chroot
FinalizeScripts=%D/tools/finalize-uutils.sh
                %D/tools/install-allocator-preload.sh
                %D/tools/audit-os-tree.py
RemoveFiles=
    # Package scriptlets run before this step. These commands and hooks belong on the builder.
    /etc/X11/xinit/xinitrc.d/50-systemd-user.sh
    /etc/bashrc
    /etc/profile
    /etc/profile.d
    /etc/security/namespace.init
    /usr/bin/alias
    /usr/bin/bash
    /usr/bin/bashbug*
    /usr/bin/bg
    /usr/bin/blkdeactivate
    /usr/bin/ca-legacy
    /usr/bin/cd
    /usr/bin/command
    /usr/bin/cracklib-format
    /usr/bin/cracklib-update
    /usr/bin/create-cracklib-dict
    /usr/bin/dracut
    /usr/bin/egrep
    /usr/bin/fc
    /usr/bin/fg
    /usr/bin/fgrep
    /usr/bin/getopts
    /usr/bin/gunzip
    /usr/bin/gzexe
    /usr/bin/hash
    /usr/bin/jobs
    /usr/bin/kernel-install
    /usr/bin/ldd
    /usr/bin/lsinitrd
    /usr/bin/pam_namespace_helper
    /usr/bin/pkg-config
    /usr/bin/pkgconf
    /usr/bin/read
    /usr/bin/sed
    /usr/bin/sh
    /usr/bin/sotruss
    /usr/bin/type
    /usr/bin/tzselect
    /usr/bin/ulimit
    /usr/bin/umask
    /usr/bin/unalias
    /usr/bin/unicode_start
    /usr/bin/unicode_stop
    /usr/bin/update-ca-trust
    /usr/bin/wait
    /usr/bin/x86_64-redhat-linux-gnu-pkg-config
    /usr/bin/xzdiff
    /usr/bin/xzgrep
    /usr/bin/xzless
    /usr/bin/xzmore
    /usr/bin/zcat
    /usr/bin/zcmp
    /usr/bin/zdiff
    /usr/bin/zegrep
    /usr/bin/zfgrep
    /usr/bin/zforce
    /usr/bin/zgrep
    /usr/bin/zless
    /usr/bin/zmore
    /usr/bin/znew
    /usr/bin/zstdgrep
    /usr/bin/zstdless
    /usr/lib/dracut
    /usr/lib/kernel/install.d
    /usr/lib/systemd/system/dracut-*.service
    /usr/lib/systemd/system/*.wants/dracut-*.service
    /usr/lib/systemd/system/fips-crypto-policy-overlay.service
    /etc/systemd/system/*.wants/fips-crypto-policy-overlay.service
    /usr/lib/systemd/systemd-update-helper
    /usr/libexec/fips-crypto-policy-overlay
    /usr/libexec/fips-setup-helper
    /usr/libexec/grepconf.sh
    /usr/libexec/p11-kit/trust-extract-compat
    # Login and privilege-changing helpers have no callers in the appliance base.
    /usr/bin/agetty
    /usr/bin/chfn
    /usr/bin/chsh
    /usr/bin/login
    /usr/bin/pam_timestamp_check
    /usr/bin/su
    /usr/bin/sulogin
    /usr/bin/unix_chkpwd
    /usr/lib/systemd/system/*getty*.service
    /usr/lib/systemd/system/*.wants/*getty*.service
    /etc/systemd/system/*.wants/*getty*.service
    /usr/lib/systemd/system/debug-shell.service
    /usr/lib/systemd/systemd-sulogin-shell
