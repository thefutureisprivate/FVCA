<?xml version="1.0"?>
<busconfig>
  <type>system</type>
  <listen>systemd:</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny user="*"/>
    <allow user="root"/>
    <deny own="*"/>
    <deny send_destination="*"/>
    <deny receive_sender="*" eavesdrop="true"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return" receive_requested_reply="true"/>
    <allow receive_type="error" receive_requested_reply="true"/>
    <allow receive_type="signal"/>
    <allow send_type="method_return" send_requested_reply="true" max_fds="0"/>
    <allow send_type="error" send_requested_reply="true" max_fds="0"/>
  </policy>
  <policy user="root">
    <allow own="org.freedesktop.fwupd"/>
    <allow send_destination="org.freedesktop.DBus" send_path="/org/freedesktop/DBus"
           send_interface="org.freedesktop.DBus" send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="GetDevices" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="GetPlugins" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="GetUpgrades" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="UpdateMetadata" min_fds="2" max_fds="2"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="VerifyFvcaCabinet" min_fds="1" max_fds="1"/>
  </policy>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_message_unix_fds">2</limit>
  <limit name="max_incoming_bytes">2097152</limit>
  <limit name="max_outgoing_bytes">2097152</limit>
  <limit name="max_completed_connections">16</limit>
</busconfig>
