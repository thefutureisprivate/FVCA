<?xml version="1.0"?>
<busconfig>
  <include>firmware-bus-common.conf</include>
  <policy context="default">
    <allow user="fvca-firmware-reader"/>
  </policy>
  <policy user="fvca-firmware-reader">
    <allow send_destination="org.freedesktop.DBus" send_path="/org/freedesktop/DBus"
           send_interface="org.freedesktop.DBus" send_member="Hello" send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.DBus" send_path="/org/freedesktop/DBus"
           send_interface="org.freedesktop.DBus" send_member="GetNameOwner" send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.DBus" send_path="/org/freedesktop/DBus"
           send_interface="org.freedesktop.DBus" send_member="GetConnectionUnixUser" send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.DBus" send_path="/org/freedesktop/DBus"
           send_interface="org.freedesktop.DBus" send_member="GetConnectionSELinuxSecurityContext"
           send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="GetDevices" max_fds="0"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="GetPlugins" max_fds="0"/>
    <allow send_destination="org.freedesktop.fwupd" send_path="/" send_type="method_call"
           send_interface="org.freedesktop.fwupd" send_member="GetFvcaResult" max_fds="0"/>
  </policy>
</busconfig>
