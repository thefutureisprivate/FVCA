[package]
name = "fvca-workload-admission"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
base64 = "0.23.1"
gpt = "4.1.0"
libc = "0.2"
openssl = "0.10.82"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
strip = "symbols"
