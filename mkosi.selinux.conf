[Content]
Packages=
    selinux-policy-targeted-45.24-1.fc45
    policycoreutils-3.11-2.fc45
SELinuxRelabel=no
PostInstallationScripts=%D/tools/install-selinux-policy.sh.chroot
BuildScripts=%D/tools/build-selinux-check.sh.chroot
RemoveFiles=
    /usr/bin/awk
    /usr/bin/fixfiles
    /usr/bin/gawk*
    /usr/bin/load_policy
    /usr/bin/semodule*
    /usr/bin/setsebool
    /usr/lib/systemd/system-generators/selinux-autorelabel-generator.sh
    /usr/lib/systemd/system/selinux-autorelabel*
    /usr/lib/systemd/system/selinux-check-proper-disable.service
    /usr/libexec/selinux
